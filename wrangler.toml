name = "diviatechv1"
main = "src/workers/index.ts"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_NAME = "Divia"
NEXT_PUBLIC_API_URL = "https://diviatechv1.xear3d80.workers.dev"
ALLOWED_ORIGINS = "http://localhost:3000,https://diviatechv1.pages.dev,https://diviatech.com"

[[d1_databases]]
binding = "DB"
database_name = "divia-prod"
database_id = "1cfd224f-b45e-484b-a37d-a1d5adc673ce"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d0b0051fe1904664ab51aa41d10195ba"

[[kv_namespaces]]
binding = "CACHE"
id = "a57eb9eadd1a415f9801b9b2bb39c8ea"

[ai]
binding = "AI"
