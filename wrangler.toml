name = "diviatech"
main = "src/workers/index.ts"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_NAME = "Divia"
NEXT_PUBLIC_API_URL = "https://diviatech.xear3d80.workers.dev"
ALLOWED_ORIGINS = "http://localhost:3000,https://diviatech.pages.dev,https://diviatech.com"

[[d1_databases]]
binding = "DB"
database_name = "divia-prod"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSION_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_CACHE_KV_NAMESPACE_ID"

[ai]
binding = "AI"
